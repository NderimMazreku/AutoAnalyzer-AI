<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AutoAnalyzer AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    padding: 22px 20px 35px;
}

.header-top {
    max-width: 950px;
    margin: auto;
    display: flex;
    justify-content: flex-end;
}

.languages {
    display: flex;
    gap: 8px;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.lang-btn {
    padding: 7px 11px;
    background: #374151;
    color: white;
    border-radius: 6px;
}

.lang-btn.active {
    background: #2563eb;
}

.hero {
    text-align: center;
    margin-top: 15px;
}

.hero h1 {
    margin: 0;
    font-size: 34px;
}

.hero p {
    margin: 8px 0 0;
    color: #d1d5db;
}

.container {
    max-width: 950px;
    margin: 35px auto;
    padding: 0 20px 60px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

h3 {
    margin-top: 28px;
}

.import-box {
    padding: 24px;
    margin-bottom: 30px;
    border: 1px solid #bfdbfe;
    background: #eff6ff;
    border-radius: 12px;
}

.import-box p {
    color: #4b5563;
    line-height: 1.5;
}

.url-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
}

.url-row button {
    margin: 0;
    white-space: nowrap;
}

.import-status {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    line-height: 1.5;
}

.import-success {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #bbf7d0;
}

.import-error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
}

.listing-info {
    display: none;
    margin-top: 18px;
    padding: 18px;
    background: white;
    border-radius: 10px;
    border: 1px solid #dbeafe;
}

.listing-info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.listing-info-item {
    padding: 10px;
    background: #f9fafb;
    border-radius: 7px;
}

.listing-info-item strong {
    display: block;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 4px;
}

.modifications-box {
    display: none;
    margin-top: 15px;
    padding: 15px;
    border-radius: 8px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
}

.modifications-box strong {
    color: #9a3412;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

.primary-button {
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 17px;
}

.primary-button:hover {
    background: #1d4ed8;
}

.import-button {
    padding: 12px 18px;
    border-radius: 8px;
    background: #2563eb;
    color: white;
}

.import-button:hover {
    background: #1d4ed8;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.section-result {
    display: none;
    margin-top: 25px;
    padding: 25px;
    background: #f9fafb;
    border-radius: 12px;
}

.price {
    font-size: 32px;
    font-weight: bold;
    color: #2563eb;
    margin: 8px 0 20px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.result-box {
    background: white;
    padding: 16px;
    border-radius: 9px;
    border: 1px solid #e5e7eb;
}

.result-box strong {
    display: block;
    margin-bottom: 8px;
}

.summary-box {
    margin-top: 20px;
    padding: 17px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    line-height: 1.6;
}

.warning-section {
    display: none;
    margin-top: 25px;
    padding: 25px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 12px;
}

.warning-section h2 {
    color: #92400e;
}

.risk-item {
    margin-top: 14px;
    padding: 16px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.risk-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 8px;
}

.risk-name {
    font-weight: bold;
    font-size: 16px;
}

.risk-badge {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.risk-low {
    background: #dcfce7;
    color: #166534;
}

.risk-medium {
    background: #fef3c7;
    color: #92400e;
}

.risk-high {
    background: #fee2e2;
    color: #991b1b;
}

.risk-reason {
    color: #4b5563;
    line-height: 1.5;
}

ul {
    padding-left: 22px;
}

li {
    margin-bottom: 10px;
    line-height: 1.5;
}

.error {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #fee2e2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    color: #991b1b;
}

.disclaimer {
    margin-top: 30px;
    font-size: 13px;
    color: #6b7280;
    line-height: 1.5;
}

@media(max-width: 650px) {

    .grid,
    .result-grid,
    .listing-info-grid,
    .url-row {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 20px;
    }

    .hero h1 {
        font-size: 28px;
    }

    .import-button {
        width: 100%;
    }
}

</style>

</head>


<body>


<header>

<div class="header-top">

    <div class="languages">

        <button
            class="lang-btn active"
            id="btn-de"
            onclick="setLanguage('de')"
        >
            🇩🇪 DE
        </button>

        <button
            class="lang-btn"
            id="btn-en"
            onclick="setLanguage('en')"
        >
            🇬🇧 EN
        </button>

        <button
            class="lang-btn"
            id="btn-it"
            onclick="setLanguage('it')"
        >
            🇮🇹 IT
        </button>

    </div>

</div>


<div class="hero">

    <h1>🚗 AutoAnalyzer AI</h1>

    <p id="subtitle"></p>

</div>

</header>


<div class="container">

<div class="card">


<!-- IMPORT -->

<div class="import-box">

    <h2 id="importTitle"></h2>

    <p id="importDescription"></p>

    <div class="url-row">

        <input
            id="listingUrl"
            type="url"
            placeholder="https://www.kleinanzeigen.de/s-anzeige/..."
        >

        <button
            class="import-button"
            id="importButton"
            onclick="importListing()"
        ></button>

    </div>


    <div
        id="importStatus"
        class="import-status"
    ></div>


    <div
        id="listingInfo"
        class="listing-info"
    >

        <div class="listing-info-grid">

            <div class="listing-info-item">

                <strong id="fuelInfoLabel"></strong>

                <span id="fuelInfo">—</span>

            </div>


            <div class="listing-info-item">

                <strong id="gearboxInfoLabel"></strong>

                <span id="gearboxInfo">—</span>

            </div>


            <div class="listing-info-item">

                <strong id="tuvInfoLabel"></strong>

                <span id="tuvInfo">—</span>

            </div>


            <div class="listing-info-item">

                <strong id="accidentInfoLabel"></strong>

                <span id="accidentInfo">—</span>

            </div>

        </div>


        <div
            id="modificationsBox"
            class="modifications-box"
        >

            <strong id="modificationsLabel"></strong>

            <ul id="modificationsList"></ul>

        </div>

    </div>

</div>


<!-- DATI AUTO -->

<h2 id="vehicleTitle"></h2>


<div class="grid">

    <div class="field">

        <label id="labelBrand"></label>

        <input
            id="marca"
            value="Audi"
        >

    </div>


    <div class="field">

        <label id="labelModel"></label>

        <input
            id="modello"
            value="A7 50 TDI quattro"
        >

    </div>


    <div class="field">

        <label id="labelYear"></label>

        <input
            id="anno"
            type="number"
            value="2020"
        >

    </div>


    <div class="field">

        <label id="labelPrice"></label>

        <input
            id="prezzo"
            type="number"
            value="22980"
        >

    </div>


    <div class="field">

        <label id="labelKm"></label>

        <input
            id="km"
            type="number"
            value="59315"
        >

    </div>


    <div class="field">

        <label id="labelPower"></label>

        <input
            id="potenza"
            type="number"
            value="286"
        >

    </div>

</div>


<!-- FINANZIAMENTO -->

<h2
    id="financeTitle"
    style="margin-top:35px;"
></h2>


<div class="grid">

    <div class="field">

        <label id="labelDeposit"></label>

        <input
            id="anticipo"
            type="number"
            value="2000"
        >

    </div>


    <div class="field">

        <label id="labelMonths"></label>

        <input
            id="durata"
            type="number"
            value="84"
        >

    </div>


    <div class="field">

        <label id="labelInterest"></label>

        <input
            id="tasso"
            type="number"
            step="0.1"
            value="8"
        >

    </div>

</div>


<button
    class="primary-button"
    id="analyzeButton"
    onclick="analizzaAuto()"
></button>


<div
    class="error"
    id="errorBox"
></div>


<!-- RISULTATO FINANZIAMENTO -->

<div
    class="section-result"
    id="result"
>

    <h2 id="nomeAuto"></h2>

    <p id="monthlyPaymentLabel"></p>

    <div
        class="price"
        id="rata"
    ></div>


    <div class="result-grid">

        <div class="result-box">

            <strong id="financedLabel"></strong>

            <span id="capitale"></span>

        </div>


        <div class="result-box">

            <strong id="interestTotalLabel"></strong>

            <span id="interessi"></span>

        </div>


        <div class="result-box">

            <strong id="paymentsTotalLabel"></strong>

            <span id="totaleRate"></span>

        </div>


        <div class="result-box">

            <strong id="totalCostLabel"></strong>

            <span id="costoTotale"></span>

        </div>

    </div>

</div>


<!-- AI RISIKOCHECK -->

<div
    class="section-result"
    id="riskResult"
>

    <h2 id="riskTitle"></h2>

    <p id="riskDescription"></p>

    <div id="riskContainer"></div>

</div>


<!-- ANALISI -->

<div
    class="section-result"
    id="analysisResult"
>

    <h2 id="analysisTitle"></h2>

    <div
        id="summaryBox"
        class="summary-box"
        style="display:none;"
    ></div>


    <div class="result-grid">

        <div class="result-box">

            <strong id="ageLabel"></strong>

            <span id="etaAuto"></span>

        </div>


        <div class="result-box">

            <strong id="yearlyKmLabel"></strong>

            <span id="kmAnnui"></span>

        </div>


        <div class="result-box">

            <strong id="mileageLabel"></strong>

            <span id="valutazioneKm"></span>

        </div>


        <div class="result-box">

            <strong id="priceKmLabel"></strong>

            <span id="prezzoKm"></span>

        </div>

    </div>


    <h3 id="checklistTitle"></h3>

    <ul id="checklist"></ul>


    <h3 id="questionsTitle"></h3>

    <ul id="domandeVenditore"></ul>

</div>


<!-- PUNTI SPECIFICI -->

<div
    class="warning-section"
    id="specificResult"
>

    <h2 id="specificTitle"></h2>

    <p id="specificDescription"></p>

    <ul id="controlliSpecifici"></ul>

</div>


<div
    class="disclaimer"
    id="disclaimer"
></div>


</div>

</div>

    currentLanguage = lang;

    document.getElementById("checklistTitle").textContent =
        t.checklist;

    document.getElementById("questionsTitle").textContent =
        t.questions;

    document.getElementById("specificTitle").textContent =
        t.specificTitle;

    document.getElementById("specificDescription").textContent =
        t.specificDescription;

    document.getElementById("disclaimer").textContent =

    document.querySelectorAll(".lang-btn").forEach(

    );

        .getElementById("btn-" + lang)
        .classList

}


function euro(numero) {

    const locale =
        currentLanguage === "de"
            ? "de-DE"
            : currentLanguage === "it"
                ? "it-IT"
                : "en-GB";

    return Number(numero).toLocaleString(
        locale,
        {
            style: "currency",
            currency: "EUR"
        }
    );
}


function numeroLocale(numero) {

    const locale =
        currentLanguage === "de"
            ? "de-DE"
            : currentLanguage === "it"
                ? "it-IT"
                : "en-GB";

    return Number(numero).toLocaleString(locale);
}


function mostraValore(value) {

    if (
        value === null
        || value === undefined
        || value === ""
    ) {
        return "—";
    }

    return String(value);
}


function renderList(elementId, items) {

    const list =
        document.getElementById(elementId);

    list.innerHTML = "";

    if (!Array.isArray(items)) {
        return;
    }

    items.forEach(item => {

        const li =
            document.createElement("li");

        li.textContent = item;

        list.appendChild(li);
    });
}


function renderRiskCheck(rischi) {

    const container =
        document.getElementById("riskContainer");

    const section =
        document.getElementById("riskResult");

    container.innerHTML = "";

    if (
        !rischi
        || typeof rischi !== "object"
        || Object.keys(rischi).length === 0
    ) {

        section.style.display = "none";

        return;
    }


    const labels = {

        de: {
            motore_tuning: "🔧 Motor & Tuning",
            legalita_tuv: "📋 Legalität & TÜV",
            manutenzione: "🛠️ Wartung",
            incidenti_carrozzeria: "🚘 Unfälle & Karosserie",
            costi: "💶 Kosten",

            low: "NIEDRIG",
            medium: "MITTEL",
            high: "HOCH"
        },

        en: {
            motore_tuning: "🔧 Engine & Tuning",
            legalita_tuv: "📋 Legality & Inspection",
            manutenzione: "🛠️ Maintenance",
            incidenti_carrozzeria: "🚘 Accidents & Bodywork",
            costi: "💶 Costs",

            low: "LOW",
            medium: "MEDIUM",
            high: "HIGH"
        },

        it: {
            motore_tuning: "🔧 Motore & Tuning",
            legalita_tuv: "📋 Legalità & Revisione",
            manutenzione: "🛠️ Manutenzione",
            incidenti_carrozzeria: "🚘 Incidenti & Carrozzeria",
            costi: "💶 Costi",

            low: "BASSO",
            medium: "MEDIO",
            high: "ALTO"
        }
    };


    const lang =
        labels[currentLanguage]
        || labels.de;


    const categories = [

        "motore_tuning",

        "legalita_tuv",

        "manutenzione",

        "incidenti_carrozzeria",

        "costi"
    ];


    categories.forEach(category => {

        const risk =
            rischi[category];

        if (
            !risk
            || typeof risk !== "object"
        ) {
            return;
        }


        let level =
            String(
                risk.livello || "medium"
            ).toLowerCase();


        if (
            ![
                "low",
                "medium",
                "high"
            ].includes(level)
        ) {

            level = "medium";
        }


        const item =
            document.createElement("div");

        item.className =
            "risk-item";


        const header =
            document.createElement("div");

        header.className =
            "risk-header";


        const name =
            document.createElement("div");

        name.className =
            "risk-name";

        name.textContent =
            lang[category]
            || category;


        const badge =
            document.createElement("span");

        badge.className =
            "risk-badge risk-" + level;

        badge.textContent =
            lang[level];


        const reason =
            document.createElement("div");

        reason.className =
            "risk-reason";

        reason.textContent =
            risk.motivo || "—";


        header.appendChild(name);

        header.appendChild(badge);

        item.appendChild(header);

        item.appendChild(reason);

        container.appendChild(item);
    });


    if (container.children.length > 0) {

        section.style.display =
            "block";

    } else {

        section.style.display =
            "none";
    }
}


async function importListing() {

    const t =
        translations[currentLanguage];

    const url =
        document
            .getElementById("listingUrl")
            .value
            .trim();

    const button =
        document.getElementById("importButton");

    const status =
        document.getElementById("importStatus");


    if (!url) {

        status.className =
            "import-status import-error";

        status.textContent =
            t.importError;

        status.style.display =
            "block";

        return;
    }


    button.disabled = true;

    button.textContent =
        t.importing;

    status.style.display =
        "none";


    try {

        const response =
            await fetch(
                "/extract-listing",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        url: url,
                        lingua: currentLanguage
                    })
                }
            );


        const result =
            await response.json();


        if (
            !response.ok
            || !result.success
        ) {

            throw new Error(
                result.errore
                || "Import failed"
            );
        }


        const d =
            result.dati_estratti || {};


        importedListingData = d;


        if (d.marca != null) {

            document
                .getElementById("marca")
                .value = d.marca;
        }


        if (d.modello != null) {

            document
                .getElementById("modello")
                .value = d.modello;
        }


        if (d.anno != null) {

            document
                .getElementById("anno")
                .value = d.anno;
        }


        if (d.prezzo != null) {

            document
                .getElementById("prezzo")
                .value = d.prezzo;
        }


        if (d.km != null) {

            document
                .getElementById("km")
                .value = d.km;
        }


        if (d.potenza_cv != null) {

            document
                .getElementById("potenza")
                .value = d.potenza_cv;
        }


        document
            .getElementById("fuelInfo")
            .textContent =
                mostraValore(d.carburante);


        document
            .getElementById("gearboxInfo")
            .textContent =
                mostraValore(d.cambio);


        document
            .getElementById("tuvInfo")
            .textContent =
                mostraValore(d.tuv);


        document
            .getElementById("accidentInfo")
            .textContent =
                mostraValore(d.incidenti);


        const modificationsBox =
            document.getElementById(
                "modificationsBox"
            );


        const modificationsList =
            document.getElementById(
                "modificationsList"
            );


        modificationsList.innerHTML = "";


        if (
            Array.isArray(d.modifiche)
            && d.modifiche.length > 0
        ) {

            d.modifiche.forEach(item => {

                const li =
                    document.createElement("li");

                li.textContent =
                    item;

                modificationsList
                    .appendChild(li);
            });


            modificationsBox.style.display =
                "block";

        } else {

            modificationsBox.style.display =
                "none";
        }


        document
            .getElementById("listingInfo")
            .style.display =
                "block";


        status.className =
            "import-status import-success";

        status.textContent =
            t.importSuccess;

        status.style.display =
            "block";


        document
            .getElementById("vehicleTitle")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });


    } catch(error) {

        console.error(
            "Import error:",
            error
        );

        status.className =
            "import-status import-error";

        status.textContent =
            t.importError;

        status.style.display =
            "block";


    } finally {

        button.disabled =
            false;

        button.textContent =
            t.importButton;
    }
}


async function analizzaAuto() {

    const t =
        translations[currentLanguage];

    const button =
        document.getElementById(
            "analyzeButton"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.style.display =
        "none";


    const dati = {

        lingua:
            currentLanguage,

        marca:
            document
                .getElementById("marca")
                .value
                .trim(),

        modello:
            document
                .getElementById("modello")
                .value
                .trim(),

        anno:
            Number(
                document
                    .getElementById("anno")
                    .value
            ),

        prezzo:
            Number(
                document
                    .getElementById("prezzo")
                    .value
            ),

        km:
            Number(
                document
                    .getElementById("km")
                    .value
            ),

        potenza_cv:
            Number(
                document
                    .getElementById("potenza")
                    .value
            ),

        anticipo:
            Number(
                document
                    .getElementById("anticipo")
                    .value
            ),

        durata_mesi:
            Number(
                document
                    .getElementById("durata")
                    .value
            ),

        tasso_annuo:
            Number(
                document
                    .getElementById("tasso")
                    .value
            ),

        carburante:
            importedListingData?.carburante
            ?? null,

        cambio:
            importedListingData?.cambio
            ?? null,

        tuv:
            importedListingData?.tuv
            ?? null,

        incidenti:
            importedListingData?.incidenti
            ?? null,

        modifiche:
            Array.isArray(
                importedListingData?.modifiche
            )
                ? importedListingData.modifiche
                : []
    };


    if (
        !dati.marca
        || !dati.modello
        || dati.anno <= 0
        || dati.prezzo <= 0
        || dati.km < 0
        || dati.potenza_cv <= 0
        || dati.anticipo < 0
        || dati.durata_mesi <= 0
        || dati.tasso_annuo < 0
    ) {

        errorBox.textContent =
            t.error;

        errorBox.style.display =
            "block";

        return;
    }


    button.disabled =
        true;

    button.textContent =
        t.loading;


    try {

        const response =
            await fetch(
                "/analyze",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(dati)
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Analyze HTTP error:",
                response.status,
                errorText
            );

            throw new Error(
                "Server error "
                + response.status
            );
        }


        const result =
            await response.json();


        console.log(
            "Analysis result:",
            result
        );


        renderRiskCheck(
            result.analisi?.rischi || {}
        );


        document
            .getElementById("nomeAuto")
            .textContent =
                result.auto;


        document
            .getElementById("rata")
            .textContent =
                euro(
                    result.finanziamento
                        .rata_mensile
                )
                + " / "
                + t.month;


        document
            .getElementById("capitale")
            .textContent =
                euro(
                    result.finanziamento
                        .capitale_finanziato
                );


        document
            .getElementById("interessi")
            .textContent =
                euro(
                    result.finanziamento
                        .interessi_totali
                );


        document
            .getElementById("totaleRate")
            .textContent =
                euro(
                    result.finanziamento
                        .totale_rate
                );


        document
            .getElementById("costoTotale")
            .textContent =
                euro(
                    result.finanziamento
                        .costo_totale_con_anticipo
                );


        const etaAuto =
            document.getElementById(
                "etaAuto"
            );


        etaAuto.dataset.value =
            result.eta_anni;


        etaAuto.textContent =
            result.eta_anni
            + " "
            + t.years;


        document
            .getElementById("kmAnnui")
            .textContent =
                numeroLocale(
                    result.analisi.km_annui
                )
                + " km";


        document
            .getElementById("valutazioneKm")
            .textContent =
                result.analisi
                    .valutazione_km;


        document
            .getElementById("prezzoKm")
            .textContent =
                euro(
                    result.prezzo_per_km
                );


        const summaryBox =
            document.getElementById(
                "summaryBox"
            );


        if (
            result.analisi?.riassunto_ai
        ) {

            summaryBox.textContent =
                result.analisi
                    .riassunto_ai;

            summaryBox.style.display =
                "block";

        } else {

            summaryBox.style.display =
                "none";
        }


        renderList(
            "checklist",
            result.analisi?.checklist || []
        );


        renderList(
            "domandeVenditore",
            result.analisi
                ?.domande_venditore
            || []
        );


        renderList(
            "controlliSpecifici",
            result.analisi
                ?.controlli_specifici
            || []
        );


        document
            .getElementById("result")
            .style.display =
                "block";


        document
            .getElementById(
                "analysisResult"
            )
            .style.display =
                "block";


        document
            .getElementById(
                "specificResult"
            )
            .style.display =
                "block";


        document
            .getElementById("result")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });


    } catch(error) {

        console.error(
            "Analysis error:",
            error
        );

        errorBox.textContent =
            t.analysisError;

        errorBox.style.display =
            "block";


    } finally {

        button.disabled =
            false;

        button.textContent =
            t.analyze;
    }
}


setLanguage("de");


</script>
