<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAnalyzer AI</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 20px 35px;
        }

        .header-top {
            max-width: 950px;
            margin: auto;
            display: flex;
            justify-content: flex-end;
        }

        .languages {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .lang-btn {
            padding: 7px 11px;
            background: #374151;
            color: white;
            border-radius: 6px;
        }

        .lang-btn.active {
            background: #2563eb;
        }

        .hero {
            text-align: center;
            margin-top: 15px;
        }

        .hero h1 {
            margin: 0;
            font-size: 34px;
        }

        .hero p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 20px 60px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }

        h2 { margin-top: 0; }
        h3 { margin-top: 28px; }

        .import-box {
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            border-radius: 12px;
        }

        .import-box p {
            color: #4b5563;
            line-height: 1.5;
        }

        .url-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .url-row button {
            margin: 0;
            white-space: nowrap;
        }

        .import-status {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .import-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .import-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .listing-info {
            display: none;
            margin-top: 18px;
            padding: 18px;
            background: white;
            border-radius: 10px;
            border: 1px solid #dbeafe;
        }

        .listing-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .listing-info-item {
            padding: 10px;
            background: #f9fafb;
            border-radius: 7px;
        }

        .listing-info-item strong {
            display: block;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .modifications-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }

        .modifications-box strong {
            color: #9a3412;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .primary-button {
            width: 100%;
            margin-top: 28px;
            padding: 16px;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .import-button {
            padding: 12px 18px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
        }

        .import-button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .section-result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #f9fafb;
            border-radius: 12px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin: 8px 0 20px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .result-box {
            background: white;
            padding: 16px;
            border-radius: 9px;
            border: 1px solid #e5e7eb;
        }

        .result-box strong {
            display: block;
            margin-bottom: 8px;
        }

        .warning-section {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 12px;
        }

        .warning-section h2 {
            color: #92400e;
        }

        ul { padding-left: 22px; }

        li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #991b1b;
        }

        .disclaimer {
            margin-top: 30px;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }

        @media(max-width: 650px) {
            .grid,
            .result-grid,
            .listing-info-grid,
            .url-row {
                grid-template-columns: 1fr;
            }

            .card { padding: 20px; }

            .hero h1 { font-size: 28px; }

            .import-button { width: 100%; }
        }
    </style>
</head>

function setLanguage(lang) {

    currentLanguage = lang;

    document.documentElement.lang = lang;

    const t = translations[lang];

    document.getElementById("subtitle").innerText = t.subtitle;

    document.getElementById("importTitle").innerText = t.importTitle;

    document.getElementById("vehicleTitle").innerText = t.vehicleTitle;
    document.getElementById("labelBrand").innerText = t.brand;
    document.getElementById("labelModel").innerText = t.model;
    document.getElementById("labelYear").innerText = t.year;
    document.getElementById("labelPrice").innerText = t.price;
    document.getElementById("labelKm").innerText = t.km;
    document.getElementById("labelPower").innerText = t.power;

    document.getElementById("financeTitle").innerText = t.financeTitle;
    document.getElementById("labelDeposit").innerText = t.deposit;
    document.getElementById("labelMonths").innerText = t.months;
    document.getElementById("labelInterest").innerText = t.interest;

    document.getElementById("monthlyPaymentLabel").innerText = t.monthlyPayment;
    document.getElementById("financedLabel").innerText = t.financed;
    document.getElementById("interestTotalLabel").innerText = t.interestTotal;
    document.getElementById("paymentsTotalLabel").innerText = t.paymentsTotal;
    document.getElementById("totalCostLabel").innerText = t.totalCost;

    document.getElementById("ageLabel").innerText = t.age;
    document.getElementById("yearlyKmLabel").innerText = t.yearlyKm;

    document.getElementById("priceKmLabel").innerText = t.priceKm;

    document.getElementById("checklistTitle").innerText = t.checklist;
    document.getElementById("questionsTitle").innerText = t.questions;

    document.getElementById("specificTitle").innerText = t.specificTitle;
    document.getElementById("specificDescription").innerText =
        t.specificDescription;

    document.getElementById("disclaimer").innerText = t.disclaimer;

    document.querySelectorAll(".lang-btn").forEach(
        btn => btn.classList.remove("active")
    );

    document.getElementById("btn-" + lang).classList.add("active");

    const eta = document.getElementById("etaAuto");

    if (eta.dataset.value) {
        eta.innerText = eta.dataset.value + " " + t.years;
    }
}


function euro(numero) {

    const locale =
        currentLanguage === "de"
        ? "de-DE"
        : currentLanguage === "it"
        ? "it-IT"
        : "en-GB";

    return Number(numero).toLocaleString(
        locale,
        {
            style: "currency",
            currency: "EUR"
        }
    );
}


function mostraValore(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    return value;
}


async function importListing() {

    const t = translations[currentLanguage];

    const url = document
        .getElementById("listingUrl")
        .value
        .trim();

    const button = document.getElementById("importButton");
    const status = document.getElementById("importStatus");

    if (!url) {

        status.className = "import-status import-error";
        status.innerText = t.importError;
        status.style.display = "block";

        return;
    }

    button.disabled = true;
    button.innerText = t.importing;

    status.style.display = "none";

    try {

        const response = await fetch(
            "/extract-listing",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: url,
                    lingua: currentLanguage
                })
            }
        );

        if (!response.ok) {
            throw new Error("HTTP error");
        }

        const result = await response.json();

        if (!result.success) {

            status.className = "import-status import-error";

            status.innerText =
                result.errore || t.importError;

            status.style.display = "block";

            return;
        }

        const d = result.dati_estratti;

        if (d.marca !== null) {
            document.getElementById("marca").value = d.marca;
        }

        if (d.modello !== null) {
            document.getElementById("modello").value = d.modello;
        }

        if (d.anno !== null) {
            document.getElementById("anno").value = d.anno;
        }

        if (d.prezzo !== null) {
            document.getElementById("prezzo").value = d.prezzo;
        }

        if (d.km !== null) {
            document.getElementById("km").value = d.km;
        }

        if (d.potenza_cv !== null) {
            document.getElementById("potenza").value = d.potenza_cv;
        }

        document.getElementById("fuelInfo").innerText =
            mostraValore(d.carburante);

        document.getElementById("gearboxInfo").innerText =
            mostraValore(d.cambio);

        document.getElementById("tuvInfo").innerText =
            mostraValore(d.tuv);

        document.getElementById("accidentInfo").innerText =
            mostraValore(d.incidenti);

        const modificationsBox =
            document.getElementById("modificationsBox");

        const modificationsList =
            document.getElementById("modificationsList");

        modificationsList.innerHTML = "";

        if (
            Array.isArray(d.modifiche) &&
            d.modifiche.length > 0
        ) {

            d.modifiche.forEach(item => {

                const li = document.createElement("li");
                li.innerText = item;

                modificationsList.appendChild(li);
            });

            modificationsBox.style.display = "block";

        } else {

            modificationsBox.style.display = "none";
        }

        document.getElementById("listingInfo").style.display = "block";

        status.className = "import-status import-success";
        status.innerText = t.importSuccess;
        status.style.display = "block";

        document.getElementById("vehicleTitle").scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    } catch(error) {

        status.className = "import-status import-error";
        status.innerText = t.importError;
        status.style.display = "block";

    } finally {

        button.disabled = false;
        button.innerText = t.importButton;
    }
}


async function analizzaAuto() {

    const t = translations[currentLanguage];

    const button = document.getElementById("analyzeButton");
    const errorBox = document.getElementById("errorBox");

    errorBox.style.display = "none";

    const dati = {

        lingua: currentLanguage,

        marca:
            document.getElementById("marca").value.trim(),

        modello:
            document.getElementById("modello").value.trim(),

        anno:
            Number(document.getElementById("anno").value),

        prezzo:
            Number(document.getElementById("prezzo").value),

        km:
            Number(document.getElementById("km").value),

        potenza_cv:
            Number(document.getElementById("potenza").value),

        anticipo:
            Number(document.getElementById("anticipo").value),

        durata_mesi:
            Number(document.getElementById("durata").value),

        tasso_annuo:
            Number(document.getElementById("tasso").value)
    };

    if (
        !dati.marca ||
        !dati.modello ||
        dati.anno <= 0 ||
        dati.prezzo <= 0 ||
        dati.km < 0 ||
        dati.potenza_cv <= 0 ||
        dati.anticipo < 0 ||
        dati.durata_mesi <= 0 ||
        dati.tasso_annuo < 0
    ) {

        errorBox.innerText = t.error;
        errorBox.style.display = "block";

        return;
    }

    button.disabled = true;
    button.innerText = t.loading;

    try {

        const response = await fetch(
            "/analyze",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dati)
            }
        );

        if (!response.ok) {
            throw new Error("Server error");
        }

        const result = await response.json();

        document.getElementById("nomeAuto").innerText =
            result.auto;

        document.getElementById("rata").innerText =
            euro(result.finanziamento.rata_mensile)
            + " / "
            + t.month;

        document.getElementById("capitale").innerText =
            euro(result.finanziamento.capitale_finanziato);

        document.getElementById("interessi").innerText =
            euro(result.finanziamento.interessi_totali);

        document.getElementById("totaleRate").innerText =
            euro(result.finanziamento.totale_rate);

        document.getElementById("costoTotale").innerText =
            euro(
                result.finanziamento
                    .costo_totale_con_anticipo
            );

        const etaAuto =
            document.getElementById("etaAuto");

        etaAuto.dataset.value =
            result.eta_anni;

        etaAuto.innerText =
            result.eta_anni
            + " "
            + t.years;

        document.getElementById("kmAnnui").innerText =
            Number(result.analisi.km_annui)
                .toLocaleString()
            + " km";

        document.getElementById("valutazioneKm").innerText =
            result.analisi.valutazione_km;

        document.getElementById("prezzoKm").innerText =
            euro(result.prezzo_per_km);

        const checklist =
            document.getElementById("checklist");

        checklist.innerHTML = "";

        result.analisi.checklist.forEach(item => {

            const li = document.createElement("li");

            li.innerText = item;

            checklist.appendChild(li);
        });

        const domande =
            document.getElementById("domandeVenditore");

        domande.innerHTML = "";

        result.analisi.domande_venditore.forEach(item => {

            const li = document.createElement("li");

            li.innerText = item;

            domande.appendChild(li);
        });

        const specifici =
            document.getElementById("controlliSpecifici");

        specifici.innerHTML = "";

        result.analisi.controlli_specifici.forEach(item => {

            const li = document.createElement("li");

            li.innerText = item;

            specifici.appendChild(li);
        });

        document.getElementById("result").style.display = "block";

        document.getElementById("analysisResult").style.display = "block";

        document.getElementById("specificResult").style.display = "block";

        document.getElementById("result").scrollIntoView({
            behavior: "smooth"
        });

    } catch(error) {

        errorBox.innerText =
            currentLanguage === "de"
            ? "Bei der Analyse ist ein Fehler aufgetreten."
            : currentLanguage === "en"
            ? "An error occurred during the analysis."
            : "Si è verificato un errore durante l'analisi.";

        errorBox.style.display = "block";

    } finally {

        button.disabled = false;
        button.innerText = t.analyze;
    }
}


setLanguage("de");

</script>

</body>
</html>
