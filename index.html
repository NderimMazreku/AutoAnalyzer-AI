<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAnalyzer AI</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 20px 35px;
        }

        .header-top {
            max-width: 950px;
            margin: auto;
            display: flex;
            justify-content: flex-end;
        }

        .languages {
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            width: auto;
            margin: 0;
            padding: 7px 11px;
            font-size: 13px;
            background: #374151;
            border-radius: 6px;
        }

        .lang-btn.active {
            background: #2563eb;
        }

        .hero {
            text-align: center;
            margin-top: 15px;
        }

        .hero h1 {
            margin: 0;
            font-size: 34px;
        }

        .hero p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 20px 60px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h2 { margin-top: 0; }
        h3 { margin-top: 28px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 16px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .section-result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #f9fafb;
            border-radius: 12px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin: 8px 0 20px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .result-box {
            background: white;
            padding: 16px;
            border-radius: 9px;
            border: 1px solid #e5e7eb;
        }

        .result-box strong {
            display: block;
            margin-bottom: 8px;
        }

        .warning-section {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 12px;
        }

        .warning-section h2 {
            color: #92400e;
        }

        ul { padding-left: 22px; }

        li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #991b1b;
        }

        .disclaimer {
            margin-top: 30px;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }

        @media(max-width: 650px) {
            .grid,
            .result-grid {
                grid-template-columns: 1fr;
            }

            .card { padding: 20px; }
            .hero h1 { font-size: 28px; }
        }
    </style>
</head>

<body>

<header>

    <div class="header-top">
        <div class="languages">
            <button class="lang-btn active" id="btn-de"
                    onclick="setLanguage('de')">🇩🇪 DE</button>

            <button class="lang-btn" id="btn-en"
                    onclick="setLanguage('en')">🇬🇧 EN</button>

            <button class="lang-btn" id="btn-it"
                    onclick="setLanguage('it')">🇮🇹 IT</button>
        </div>
    </div>

    <div class="hero">
        <h1>🚗 AutoAnalyzer AI</h1>
        <p id="subtitle"></p>
    </div>

</header>


<div class="container">

<div class="card">

    <h2 id="vehicleTitle"></h2>

    <div class="grid">

        <div class="field">
            <label id="labelBrand"></label>
            <input id="marca" value="Audi">
        </div>

        <div class="field">
            <label id="labelModel"></label>
            <input id="modello" value="A7 50 TDI quattro">
        </div>

        <div class="field">
            <label id="labelYear"></label>
            <input id="anno" type="number" value="2020">
        </div>

        <div class="field">
            <label id="labelPrice"></label>
            <input id="prezzo" type="number" value="22980">
        </div>

        <div class="field">
            <label id="labelKm"></label>
            <input id="km" type="number" value="59315">
        </div>

        <div class="field">
            <label id="labelPower"></label>
            <input id="potenza" type="number" value="286">
        </div>

    </div>


    <h2 id="financeTitle" style="margin-top:35px;"></h2>

    <div class="grid">

        <div class="field">
            <label id="labelDeposit"></label>
            <input id="anticipo" type="number" value="2000">
        </div>

        <div class="field">
            <label id="labelMonths"></label>
            <input id="durata" type="number" value="84">
        </div>

        <div class="field">
            <label id="labelInterest"></label>
            <input id="tasso" type="number" step="0.1" value="8">
        </div>

    </div>


    <button id="analyzeButton" onclick="analizzaAuto()"></button>

    <div class="error" id="errorBox"></div>


    <div class="section-result" id="result">

        <h2 id="nomeAuto"></h2>

        <p id="monthlyPaymentLabel"></p>

        <div class="price" id="rata"></div>

        <div class="result-grid">

            <div class="result-box">
                <strong id="financedLabel"></strong>
                <span id="capitale"></span>
            </div>

            <div class="result-box">
                <strong id="interestTotalLabel"></strong>
                <span id="interessi"></span>
            </div>

            <div class="result-box">
                <strong id="paymentsTotalLabel"></strong>
                <span id="totaleRate"></span>
            </div>

            <div class="result-box">
                <strong id="totalCostLabel"></strong>
                <span id="costoTotale"></span>
            </div>

        </div>

    </div>


    <div class="section-result" id="analysisResult">

        <h2 id="analysisTitle"></h2>

        <div class="result-grid">

            <div class="result-box">
                <strong id="ageLabel"></strong>
                <span id="etaAuto"></span>
            </div>

            <div class="result-box">
                <strong id="yearlyKmLabel"></strong>
                <span id="kmAnnui"></span>
            </div>

            <div class="result-box">
                <strong id="mileageLabel"></strong>
                <span id="valutazioneKm"></span>
            </div>

            <div class="result-box">
                <strong id="priceKmLabel"></strong>
                <span id="prezzoKm"></span>
            </div>

        </div>

        <h3 id="checklistTitle"></h3>
        <ul id="checklist"></ul>

        <h3 id="questionsTitle"></h3>
        <ul id="domandeVenditore"></ul>

    </div>


    <div class="warning-section" id="specificResult">

        <h2 id="specificTitle"></h2>

        <p id="specificDescription"></p>

        <ul id="controlliSpecifici"></ul>

    </div>


    <div class="disclaimer" id="disclaimer"></div>

</div>

</div>


<script>

let currentLanguage = "de";


const translations = {

    de: {
        subtitle: "Gebrauchtwagen vor dem Kauf intelligent analysieren",

        vehicleTitle: "🚘 Fahrzeugdaten",
        brand: "Marke",
        model: "Modell",
        year: "Baujahr",
        price: "Kaufpreis (€)",
        km: "Kilometerstand",
        power: "Leistung (PS)",

        financeTitle: "💶 Finanzierung",
        deposit: "Anzahlung (€)",
        months: "Laufzeit (Monate)",
        interest: "Jahreszins (%)",

        analyze: "🔎 Fahrzeug analysieren",
        loading: "⏳ Analyse läuft...",

        monthlyPayment: "Geschätzte monatliche Rate",
        financed: "Finanzierter Betrag",
        interestTotal: "Zinsen gesamt",
        paymentsTotal: "Summe der Raten",
        totalCost: "Gesamtkosten",

        analysisTitle: "📊 Fahrzeuganalyse",
        age: "Fahrzeugalter",
        yearlyKm: "Km pro Jahr",
        mileage: "Kilometerbewertung",
        priceKm: "Preis pro km",

        checklist: "✅ Checkliste vor dem Kauf",
        questions: "💬 Fragen an den Verkäufer",

        specificTitle: "⚠️ Wichtige Prüfpunkte",
        specificDescription:
            "Auf Basis der Fahrzeugdaten sollten diese Punkte besonders geprüft werden:",

        years: "Jahre",

        error: "Bitte überprüfe die eingegebenen Daten.",

        disclaimer:
            "Die Informationen dienen nur zur Orientierung und ersetzen keine professionelle Fahrzeugprüfung oder ein verbindliches Finanzierungsangebot."
    },


    en: {
        subtitle: "Analyze a used car intelligently before you buy",

        vehicleTitle: "🚘 Vehicle details",
        brand: "Make",
        model: "Model",
        year: "Year",
        price: "Purchase price (€)",
        km: "Mileage",
        power: "Power (HP)",

        financeTitle: "💶 Financing",
        deposit: "Down payment (€)",
        months: "Term (months)",
        interest: "Annual interest (%)",

        analyze: "🔎 Analyze vehicle",
        loading: "⏳ Analyzing...",

        monthlyPayment: "Estimated monthly payment",
        financed: "Amount financed",
        interestTotal: "Total interest",
        paymentsTotal: "Total payments",
        totalCost: "Total cost",

        analysisTitle: "📊 Vehicle analysis",
        age: "Vehicle age",
        yearlyKm: "Km per year",
        mileage: "Mileage assessment",
        priceKm: "Price per km",

        checklist: "✅ Pre-purchase checklist",
        questions: "💬 Questions for the seller",

        specificTitle: "⚠️ Important points to check",
        specificDescription:
            "Based on the vehicle information, pay particular attention to these points:",

        years: "years",

        error: "Please check the information entered.",

        disclaimer:
            "The information provided is for guidance only and does not replace a professional vehicle inspection or a binding financing offer."
    },


    it: {
        subtitle: "Analizza un'auto usata prima di acquistarla",

        vehicleTitle: "🚘 Dati dell'auto",
        brand: "Marca",
        model: "Modello",
        year: "Anno",
        price: "Prezzo (€)",
        km: "Chilometri",
        power: "Potenza (CV)",

        financeTitle: "💶 Finanziamento",
        deposit: "Anticipo (€)",
        months: "Durata (mesi)",
        interest: "Tasso annuo (%)",

        analyze: "🔎 Analizza auto",
        loading: "⏳ Analisi in corso...",

        monthlyPayment: "Rata mensile stimata",
        financed: "Capitale finanziato",
        interestTotal: "Interessi totali",
        paymentsTotal: "Totale rate",
        totalCost: "Costo totale",

        analysisTitle: "📊 Analisi dell'auto",
        age: "Età dell'auto",
        yearlyKm: "Km medi / anno",
        mileage: "Chilometraggio",
        priceKm: "Prezzo / km",

        checklist: "✅ Checklist prima dell'acquisto",
        questions: "💬 Domande da fare al venditore",

        specificTitle: "⚠️ Punti specifici da controllare",
        specificDescription:
            "In base ai dati inseriti, presta particolare attenzione a questi aspetti:",

        years: "anni",

        error: "Controlla i dati inseriti.",

        disclaimer:
            "Le informazioni fornite sono indicative e non sostituiscono un controllo tecnico professionale dell'auto o un'offerta finanziaria ufficiale."
    }
};


function setLanguage(lang) {

    currentLanguage = lang;

    document.documentElement.lang = lang;

    const t = translations[lang];

    document.getElementById("subtitle").innerText = t.subtitle;

    document.getElementById("vehicleTitle").innerText = t.vehicleTitle;
    document.getElementById("labelBrand").innerText = t.brand;
    document.getElementById("labelModel").innerText = t.model;
    document.getElementById("labelYear").innerText = t.year;
    document.getElementById("labelPrice").innerText = t.price;
    document.getElementById("labelKm").innerText = t.km;
    document.getElementById("labelPower").innerText = t.power;

    document.getElementById("financeTitle").innerText = t.financeTitle;
    document.getElementById("labelDeposit").innerText = t.deposit;
    document.getElementById("labelMonths").innerText = t.months;
    document.getElementById("labelInterest").innerText = t.interest;

    document.getElementById("analyzeButton").innerText = t.analyze;

    document.getElementById("monthlyPaymentLabel").innerText =
        t.monthlyPayment;

    document.getElementById("financedLabel").innerText = t.financed;
    document.getElementById("interestTotalLabel").innerText =
        t.interestTotal;
    document.getElementById("paymentsTotalLabel").innerText =
        t.paymentsTotal;
    document.getElementById("totalCostLabel").innerText =
        t.totalCost;

    document.getElementById("analysisTitle").innerText =
        t.analysisTitle;

    document.getElementById("ageLabel").innerText = t.age;
    document.getElementById("yearlyKmLabel").innerText =
        t.yearlyKm;
    document.getElementById("mileageLabel").innerText =
        t.mileage;
    document.getElementById("priceKmLabel").innerText =
        t.priceKm;

    document.getElementById("checklistTitle").innerText =
        t.checklist;

    document.getElementById("questionsTitle").innerText =
        t.questions;

    document.getElementById("specificTitle").innerText =
        t.specificTitle;

    document.getElementById("specificDescription").innerText =
        t.specificDescription;

    document.getElementById("disclaimer").innerText =
        t.disclaimer;


    document.querySelectorAll(".lang-btn")
        .forEach(btn => btn.classList.remove("active"));

    document.getElementById("btn-" + lang)
        .classList.add("active");


    /* Se ci sono già risultati, aggiorna le unità */
    const eta = document.getElementById("etaAuto");

    if (eta.dataset.value) {
        eta.innerText =
            eta.dataset.value + " " + t.years;
    }
}


function euro(numero) {

    const locale =
        currentLanguage === "de"
        ? "de-DE"
        : currentLanguage === "it"
        ? "it-IT"
        : "en-GB";

    return Number(numero).toLocaleString(
        locale,
        {
            style: "currency",
            currency: "EUR"
        }
    );
}


async function analizzaAuto() {

    const t = translations[currentLanguage];

    const button =
        document.getElementById("analyzeButton");

    const errorBox =
        document.getElementById("errorBox");

    errorBox.style.display = "none";


    const dati = {

        lingua: currentLanguage,

        marca:
            document.getElementById("marca").value.trim(),

        modello:
            document.getElementById("modello").value.trim(),

        anno:
            Number(document.getElementById("anno").value),

        prezzo:
            Number(document.getElementById("prezzo").value),

        km:
            Number(document.getElementById("km").value),

        potenza_cv:
            Number(document.getElementById("potenza").value),

        anticipo:
            Number(document.getElementById("anticipo").value),

        durata_mesi:
            Number(document.getElementById("durata").value),

        tasso_annuo:
            Number(document.getElementById("tasso").value)
    };


    if (
        !dati.marca ||
        !dati.modello ||
        dati.anno <= 0 ||
        dati.prezzo <= 0 ||
        dati.km < 0 ||
        dati.potenza_cv <= 0 ||
        dati.anticipo < 0 ||
        dati.durata_mesi <= 0 ||
        dati.tasso_annuo < 0
    ) {

        errorBox.innerText = t.error;
        errorBox.style.display = "block";
        return;
    }


    button.disabled = true;
    button.innerText = t.loading;


    try {

        const response = await fetch(
            "/analyze",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dati)
            }
        );


        if (!response.ok) {
            throw new Error("Server error");
        }


        const result = await response.json();


        document.getElementById("nomeAuto").innerText =
            result.auto;


        document.getElementById("rata").innerText =
            euro(result.finanziamento.rata_mensile)
            + " / "
            + (currentLanguage === "de"
                ? "Monat"
                : currentLanguage === "en"
                ? "month"
                : "mese");


        document.getElementById("capitale").innerText =
            euro(result.finanziamento.capitale_finanziato);

        document.getElementById("interessi").innerText =
            euro(result.finanziamento.interessi_totali);

        document.getElementById("totaleRate").innerText =
            euro(result.finanziamento.totale_rate);

        document.getElementById("costoTotale").innerText =
            euro(
                result.finanziamento
                    .costo_totale_con_anticipo
            );


        const etaAuto =
            document.getElementById("etaAuto");

        etaAuto.dataset.value = result.eta_anni;

        etaAuto.innerText =
            result.eta_anni + " " + t.years;


        document.getElementById("kmAnnui").innerText =
            Number(result.analisi.km_annui)
                .toLocaleString() + " km";


        document.getElementById("valutazioneKm").innerText =
            result.analisi.valutazione_km;


        document.getElementById("prezzoKm").innerText =
            euro(result.prezzo_per_km);


        const checklist =
            document.getElementById("checklist");

        checklist.innerHTML = "";

        result.analisi.checklist.forEach(item => {

            const li = document.createElement("li");
            li.innerText = item;
            checklist.appendChild(li);

        });


        const domande =
            document.getElementById("domandeVenditore");

        domande.innerHTML = "";

        result.analisi.domande_venditore.forEach(item => {

            const li = document.createElement("li");
            li.innerText = item;
            domande.appendChild(li);

        });


        const specifici =
            document.getElementById("controlliSpecifici");

        specifici.innerHTML = "";

        result.analisi.controlli_specifici.forEach(item => {

            const li = document.createElement("li");
            li.innerText = item;
            specifici.appendChild(li);

        });


        document.getElementById("result")
            .style.display = "block";

        document.getElementById("analysisResult")
            .style.display = "block";

        document.getElementById("specificResult")
            .style.display = "block";


        document.getElementById("result")
            .scrollIntoView({
                behavior: "smooth"
            });


    } catch(error) {

        errorBox.innerText =
            currentLanguage === "de"
            ? "Bei der Analyse ist ein Fehler aufgetreten."
            : currentLanguage === "en"
            ? "An error occurred during the analysis."
            : "Si è verificato un errore durante l'analisi.";

        errorBox.style.display = "block";

    } finally {

        button.disabled = false;
        button.innerText = t.analyze;
    }
}


/* TEDESCO PREDEFINITO */

setLanguage("de");

</script>

</body>
</html>
